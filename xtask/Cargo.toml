# The CI job that is more than a command: `cargo xtask package-isolation`. Not a
# published crate — `publish = false` keeps it out of any `cargo publish` sweep,
# and it deliberately has no dependencies, since the job has to build it before
# it can do anything.
[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
