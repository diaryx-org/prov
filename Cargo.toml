[workspace]
resolver = "2"
members = ["prov", "prov-cli"]

[workspace.package]
version = "0.3.2"
edition = "2024"
# Minimum supported Rust version. Edition 2024 needs 1.85, but the crate also uses
# `if let … && let …` let-chains in stable positions, stabilized in 1.88 — so 1.88
# is the true floor, enforced by the `msrv` CI job (which reads this very value).
rust-version = "1.88"
repository = "https://github.com/diaryx-org/prov"
homepage = "https://github.com/diaryx-org/prov"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Embedded-metadata backend. fig is a Zig-backed parser/editor (its build.rs
# runs `zig build`). The value tree is prov's common currency.
#
# Only the format-agnostic infrastructure is enabled here (serde/derive/indexmap).
# The per-format parser backends (yaml/json/fig) are pulled in *by prov's own
# features* — see `prov/Cargo.toml` `[features]`, which forwards `yaml` →
# `fig/yaml`, etc. This lets a downstream user compile out the formats they don't
# use (each unused format is a Zig parser/printer left out of `libfig.a`).
#
# **2.5.3 is a floor, not a preference.** It is the release where the editor
# splice seeds a path's missing ancestors as *block* rather than inline flow.
# Before it, `set_meta_in_text` had to write a value, re-parse the document and
# compare the value's kind at the path, because a block value spliced into flow
# ancestors came out corrupt (`a: {b: - x}`, which re-reads as a string) and
# still reported success. That check and its leaf-by-leaf fallback are gone;
# lowering this bound brings the silent corruption back with nothing left to
# catch it. Note the fix is in the Zig `fig-sys`, which fig 2.5.3 requires at
# `^2.5.3` — so the floor holds transitively.
fig = { version = "2.5.3", default-features = false, features = ["serde", "derive", "indexmap"] }
# The schema layer over fig's value tree. prov uses only its `FieldType` — the
# vocabulary a `fields.<name>.type` declaration is spelled in — so that prov, a
# schema-aware frontend, and (later) a view engine all name field types
# identically instead of agreeing by convention.
fig-schema = { version = "0.1.0" }
indexmap = { version = "2.0", features = ["serde"] }
thiserror = "2.0"

# Body-prose parsing (Djot/Markdown) — prov's body-parser dependency (see
# `src/content.rs`).
#
# 2.7.1 is a floor, not a preference: it's the release where `twig-sys`
# learned to build for `wasm32-wasip1` (mapped to Zig's `wasi` os tag), which
# prov's own WASI release build needs.
twig-doc = { version = "2.7.1" }

# Opaque document-ID minting: NOID xdigit alphabet + NOID check character
# over a seeded PRNG. Prov supplies its own seed (uniqueness is enforced by
# rejection against the index, not entropy), so the dependency-free default —
# no `os`/`js` features — is all it needs. See `prov/src/identity.rs`.
moid = "1.0.0"

# Internal crate.
prov = { path = "prov", version = "0.3.2" }
