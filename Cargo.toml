[workspace]
resolver = "2"
# `xtask` holds the one CI job that is more than a command (`cargo xtask
# package-isolation`; the jobs themselves are in .config/ship.figl). It is a
# member so `cargo test --workspace` checks it, and `publish = false` keeps it
# off crates.io.
members = ["prov-graph", "prov-store", "prov-grain", "prov-views", "prov-filing", "prov-exports", "prov-config", "prov", "prov-cli", "prov-testkit", "xtask"]

[workspace.package]
version = "0.18.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 needs 1.85, but the crate also uses
# `if let … && let …` let-chains in stable positions, stabilized in 1.88 — so 1.88
# is the true floor, enforced by the `msrv` CI job (which reads this very value).
rust-version = "1.88"
repository = "https://github.com/diaryx-org/prov"
homepage = "https://github.com/diaryx-org/prov"
readme = "README.md"
license = "MIT OR Apache-2.0"
# Not on crates.io: plates, provui and diaryx consume prov from git, by commit.
publish = false

[workspace.dependencies]
# Embedded-metadata backend. fig is a pure-Rust parser/editor (since 7.0; it
# was Zig-backed through 6.x). The value tree is prov's common currency.
#
# fig's core names no language (6.0): every format is a crate that registers
# with it. prov reads and writes the four a document's metadata is written in
# most — YAML, JSON, TOML and figl — which are also the four `twig-doc`'s
# `fig` feature brings, so they are always compiled in and there are no
# per-format features any more. `prov_graph::MetaFormat` is prov's closed name
# for them; it turns into a `fig::Format` handle (registering the language on
# first use) wherever fig is asked to parse or print.
#
# **7.0 is the floor**, and 6.0 is the release that moved things:
#
# - Embedding left fig. `fig::Embed`, `EmbedType`, `fig::detect` and
#   `Embed::retype` are gone; a document's frontmatter is located and spliced
#   by twig (`twig::meta`, below), and prov reads only the archetypes twig
#   reads: `---` YAML, `+++` TOML and `---<lang>` frontmatter.
# - `fig::Format` is a per-process handle found by name, not an enum, and the
#   native dialect is named `figl` (`fig` is no format's name).
# - `ExtKind::PlistData` became `ExtKind::Data`.
#
# Earlier floors still hold through these: 2.5.3's block-seeded ancestors on
# a splice (which `set_meta_in_text` relies on to write a nested value in one
# step), 3.0's `#[non_exhaustive]` FFI-mirroring enums, and 3.1's accessors
# on `fig::Value`.
fig = { version = "7", features = ["derive", "indexmap"] }
fig-yaml = { version = "7", default-features = false, features = ["fig"] }
fig-json = { version = "7", default-features = false, features = ["fig"] }
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-figl = { version = "7", default-features = false, features = ["fig"] }
# The schema layer over fig's value tree. prov uses only its `FieldType` — the
# vocabulary a `fields.<name>.type` declaration is spelled in — so that prov, a
# schema-aware frontend, and (later) a view engine all name field types
# identically instead of agreeing by convention. Without its default `cli`
# feature it is the library alone, on `fig`.
#
# From git, on its default branch, until fig-schema's fig 7 release (0.5) is on
# crates.io: 0.4 is on fig 5, whose `Value` is not fig 7's. Move this to
# `version = "0.5"` then. flower takes it from the same place, so a program
# using both builds one fig-schema.
fig-schema = { git = "https://github.com/diaryx-org/fig-schema", branch = "master", default-features = false }
indexmap = { version = "2.0", features = ["serde"] }
thiserror = "2.0"

# Body-prose parsing (Djot/Markdown/HTML) — prov's body-parser dependency (see
# `prov-graph/src/content.rs`) — and, through its default `fig` feature,
# `twig::meta`, which locates a document's frontmatter and splices fig's
# editor back into it. twig 6 is pure Rust, and like fig its core names no
# language: each one prov parses a body in is a crate of its own, registered
# on first use.
twig-doc = "6"
twig-markdown = "6"
twig-djot = "6"
twig-html = "6"

# Opaque document-ID minting: NOID xdigit alphabet + NOID check character
# over a seeded PRNG. Prov supplies its own seed (uniqueness is enforced by
# rejection against the index, not entropy), so the dependency-free default —
# no `os`/`js` features — is all it needs. See `prov/src/identity.rs`.
moid = "1"

# Dates as an archive writes them. EDTF (ISO 8601-2, the Library of Congress
# Extended Date/Time Format) is how a `type: date` field says a reduced
# precision (`1943-05`), an approximation (`1913~`), a decade (`192X`), an
# interval (`1918/1922`, `../1920`), or that the date is not known at all
# (`XXXX`). `edtf-core` parses and bounds it — levels 0–2, `no_std`, no
# dependencies — and is what the calendar grains cut through
# (`prov-grain/src/date.rs`) and what `check` judges a `type: date` value by.
# `edtf-normalize` is the repair: a deterministic reading of date prose
# (`May 1943` → `1943-05`, `c. 1913` → `1913~`) that reports ambiguity rather
# than guessing, which is what a `check` remedy is allowed to be.
cel = "0.14"
# Room on the stack for `cel`, whose parser and interpreter recurse far deeper
# than a host thread may allow — see `prov-views/src/stack.rs`. `maybe_grow`
# costs a check when the thread has room. Not built for wasm, which has one
# stack and nothing to switch to.
stacker = "0.1"
edtf-core = "1.2"
edtf-normalize = "1.2"

# SHA-256, for `prov_graph::fixity`. Fixity used to carry its own scalar
# implementation alongside the one a dependency already pulled in, which meant
# two SHA-256s in one binary and only one of them reaching SHA-NI / the ARMv8
# crypto extensions. This is the one that does.
#
# Pure Rust and `no_std`-capable, so it costs no build toolchain and compiles on
# `wasm32-unknown-unknown` like the rest of the workspace.
sha2 = "0.11.0"
# Work-stealing threads for `prov_graph::fixity::Digests`, behind prov's
# `parallel` feature. See prov-graph's manifest.
rayon = "1.12"

# Unicode NFD, for `prov_views::search`: a query and a text compare with case
# and diacritics removed, so `alesund` finds `Ålesund`. Pure Rust, no
# dependencies beyond `tinyvec`, and its own floor (1.36) is well under ours.
unicode-normalization = "0.1"

# Internal crate.
prov = { path = "prov", version = "0.18.0" }
# Read-only graph and storage ports, identity policy, and content fixity.
prov-graph = { path = "prov-graph", version = "0.18.0", default-features = false }
# The write halves of those ports: `Storage`, the metadata editor, the ID registries.
prov-store = { path = "prov-store", version = "0.18.0", default-features = false }
# Crash-atomic staged filesystem changes and write-ahead recovery, and the
# filesystem port everything here is generic over. Lifted out of this workspace
# and published on its own, because none of it knows what a document is: it
# stages a set of file operations, lands them all-or-nothing, and rolls a
# write-ahead journal forward after a crash. Zero dependencies, so it costs the
# build nothing but itself.
#
# prov configures its journal name rather than taking the default — see
# `prov::journal::workspace_journal` for why `.prov-journal` has to stay.
fs-transaction = { version = "0.4" }
# Test scaffolding, shared so it cannot drift. Never published — see its manifest.
prov-testkit = { path = "prov-testkit" }
# Grains: how a value is cut into groups, and the chain a nest builds. Shared
# by the reading side (views) and the writing side (filing), so neither
# depends on the other.
prov-grain = { path = "prov-grain", version = "0.18.0", default-features = false }
# The declarative view format and its executor. Depends on the read core only,
# so a view engine cannot write to the workspace it reads.
prov-views = { path = "prov-views", version = "0.18.0", default-features = false }
# Where a new record goes: the `filing:` axis, split out of views because it is
# the half that writes into the spine. Describes a route; files nothing.
prov-filing = { path = "prov-filing", version = "0.18.0", default-features = false }
# Gated egress sets: a view composed with a gate, judged as an export plan.
prov-exports = { path = "prov-exports", version = "0.18.0", default-features = false }
# Workspace configuration policy, codecs, diagnostics, and vocabularies.
prov-config = { path = "prov-config", version = "0.18.0", default-features = false }
