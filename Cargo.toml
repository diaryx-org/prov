[workspace]
resolver = "2"
# `xtask` is prov's CI, as a program: `cargo xtask <job>` runs one CI job and the
# workflow runs nothing else. It is a member so `cargo test --workspace` checks
# it, and `publish = false` keeps it off crates.io.
members = ["prov-graph", "prov-store", "prov-views", "prov-exports", "prov-config", "prov", "prov-cli", "prov-testkit", "xtask"]

[workspace.package]
version = "0.11.1"
edition = "2024"
# Minimum supported Rust version. Edition 2024 needs 1.85, but the crate also uses
# `if let … && let …` let-chains in stable positions, stabilized in 1.88 — so 1.88
# is the true floor, enforced by the `msrv` CI job (which reads this very value).
rust-version = "1.88"
repository = "https://github.com/diaryx-org/prov"
homepage = "https://github.com/diaryx-org/prov"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Embedded-metadata backend. fig is a Zig-backed parser/editor (its build.rs
# runs `zig build`). The value tree is prov's common currency.
#
# Only the format-agnostic infrastructure is enabled here (serde/derive/indexmap).
# The per-format parser backends (yaml/json/fig) are pulled in *by prov's own
# features* — see `prov/Cargo.toml` `[features]`, which forwards `yaml` →
# `fig/yaml`, etc. This lets a downstream user compile out the formats they don't
# use (each unused format is a Zig parser/printer left out of `libfig.a`).
#
# **3.0.2 is a floor, not a preference.** Two reasons stack here:
#
# - 2.5.3 is where the editor splice started seeding a path's missing
#   ancestors as *block* rather than inline flow. Before it, `set_meta_in_text`
#   had to write a value, re-parse the document and compare the value's kind
#   at the path, because a block value spliced into flow ancestors came out
#   corrupt (`a: {b: - x}`, which re-reads as a string) and still reported
#   success. That check and its leaf-by-leaf fallback are gone; lowering this
#   bound brings the silent corruption back with nothing left to catch it.
#   The fix is in the Zig `fig-sys`, which fig requires transitively at the
#   same version.
# - 3.0 made fig's FFI-mirroring enums (e.g. `EmbedType`, `ExtKind`)
#   `#[non_exhaustive]` — prov's matches on them (about.rs, document.rs)
#   gained wildcard arms accordingly. 3.0.2 is where
#   `fig-sys` learned to skip its native build under `DOCS_RS`, without which
#   prov itself fails to build on docs.rs (no Zig, no network there).
# - 3.1 added convenience accessors on `fig::Value` itself (`as_str`,
#   `as_bool`, `as_seq`, `as_mapping`, `is_null`, a string/index-aware `get`),
#   letting accessor-only call sites work on `fig::Value` directly instead of
#   going through `prov_graph::meta::Value`.
fig = { version = "3.3", default-features = false, features = ["serde", "derive", "indexmap"] }
# The schema layer over fig's value tree. prov uses only its `FieldType` — the
# vocabulary a `fields.<name>.type` declaration is spelled in — so that prov, a
# schema-aware frontend, and (later) a view engine all name field types
# identically instead of agreeing by convention.
fig-schema = { version = "0.2.0" }
indexmap = { version = "2.0", features = ["serde"] }
thiserror = "2.0"

# Body-prose parsing (Djot/Markdown) — prov's body-parser dependency (see
# `src/content.rs`).
twig-doc = "3"

# Opaque document-ID minting: NOID xdigit alphabet + NOID check character
# over a seeded PRNG. Prov supplies its own seed (uniqueness is enforced by
# rejection against the index, not entropy), so the dependency-free default —
# no `os`/`js` features — is all it needs. See `prov/src/identity.rs`.
moid = "1"

# SHA-256, for `prov_graph::fixity`. Fixity used to carry its own scalar
# implementation alongside the one a dependency already pulled in, which meant
# two SHA-256s in one binary and only one of them reaching SHA-NI / the ARMv8
# crypto extensions. This is the one that does.
#
# Pure Rust and `no_std`-capable, so it costs no build toolchain and compiles on
# `wasm32-unknown-unknown` like the rest of the workspace.
sha2 = "0.11.0"

# Internal crate.
prov = { path = "prov", version = "0.11.1" }
# Read-only graph and storage ports, identity policy, and content fixity.
prov-graph = { path = "prov-graph", version = "0.11.1", default-features = false }
# The write halves of those ports: `Storage`, the metadata editor, the ID registries.
prov-store = { path = "prov-store", version = "0.11.1", default-features = false }
# Crash-atomic staged filesystem changes and write-ahead recovery, and the
# filesystem port everything here is generic over. Lifted out of this workspace
# and published on its own, because none of it knows what a document is: it
# stages a set of file operations, lands them all-or-nothing, and rolls a
# write-ahead journal forward after a crash. Zero dependencies, so it costs the
# build nothing but itself.
#
# prov configures its journal name rather than taking the default — see
# `prov::journal::workspace_journal` for why `.prov-journal` has to stay.
fs-transaction = { version = "0.2" }
# Test scaffolding, shared so it cannot drift. Never published — see its manifest.
prov-testkit = { path = "prov-testkit" }
# The declarative view format and its executor. Depends on the read core only,
# so a view engine cannot write to the workspace it reads.
prov-views = { path = "prov-views", version = "0.11.1", default-features = false }
# Gated egress sets: a view composed with a gate, judged as an export plan.
prov-exports = { path = "prov-exports", version = "0.11.1", default-features = false }
# Workspace configuration policy, codecs, diagnostics, and vocabularies.
prov-config = { path = "prov-config", version = "0.11.1", default-features = false }
