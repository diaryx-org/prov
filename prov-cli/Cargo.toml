[package]
name = "prov-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Command-line companion for the prov self-describing workspace library."
keywords = ["markdown", "frontmatter", "workspace", "cli"]
categories = ["command-line-utilities"]

# The crate is `prov-cli`; the installed command is `prov`.
[[bin]]
name = "prov"
path = "src/main.rs"

[dependencies]
# The library. Inherited plainly, so prov's own default feature (`yaml`) is
# always on — YAML is a hard baseline for the CLI, which seeds `registry.yaml`
# and falls back to `---` frontmatter. The other formats are additive and
# forwarded through this crate's features below.
prov.workspace = true
# `RelationSet::children`/`edges` read `fig::Value` directly (fig 3.1's own
# accessors superseded prov-graph's `meta::Value` wrapper for read-only call
# sites); the CLI still needs the type to hand it a converted `doc.meta`.
fig.workspace = true
# Arg parsing.
clap = { version = "4.5", features = ["derive"] }
# Text diffing for `history-diff --patch`, and only for it. A CLI-only
# dependency by decision (the mocfl/zip/backup precedent): the library reports
# how two manifests differ, which is a comparison of hashes and needs nothing.
# Turning two captured pre-images into a readable patch is a presentation
# concern, and an algorithm crate in `prov` would land on every downstream
# consumer of the library — diaryx included — to serve one flag.
similar = { version = "2", default-features = false, features = ["text"] }
cliclack = "0.5.5"

[features]
# JSON and the native fig dialect ship in the default binary, but a downstream
# build can drop either with `--no-default-features` to shrink `libfig.a`. The
# `--format` flag only offers the formats compiled in (see `MetaFormat`).
default = ["json", "toml", "fig-lang"]
json = ["prov/json"]
toml = ["prov/toml"]
fig-lang = ["prov/fig-lang"]
