[package]
name = "prov-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line companion for the prov self-describing workspace library."
keywords = ["markdown", "frontmatter", "workspace", "cli"]
categories = ["command-line-utilities"]

# The crate is `prov-cli`; the installed command is `prov`.
[[bin]]
name = "prov"
path = "src/main.rs"

[dependencies]
# The library. Inherited plainly, so prov's own default feature (`yaml`) is
# always on — YAML is a hard baseline for the CLI, which seeds `registry.yaml`
# and falls back to `---` frontmatter. The other formats are additive and
# forwarded through this crate's features below. `parallel` hashes archives
# on every core; on the WASI build it compiles to the sequential path.
prov = { workspace = true, features = ["parallel"] }
# `RelationSet::children`/`edges` read `fig::Value` directly (fig 3.1's own
# accessors superseded prov-graph's `meta::Value` wrapper for read-only call
# sites); the CLI still needs the type to hand it a converted `doc.meta`.
fig.workspace = true
# Arg parsing.
clap = { version = "4.5", features = ["derive"] }
cliclack = "0.5.5"
# One call, at startup: reset `SIGPIPE` to its default so that `prov docs
# --json | head` ends the way `cat | head` does (see `main`). Already in the
# tree through cliclack; named here because we call it ourselves.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The allocator behind the `mimalloc` feature. It is C, compiled by a build
# script, which is why it is a feature and off: building prov from source
# needs a Rust toolchain and nothing else. Not on wasm, where it has no port
# and the feature does nothing.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# Allocate with mimalloc rather than the system allocator: a `check` or a move
# over ten thousand documents is 5–15% faster, nearly all of it in freeing
# memory another thread allocated. The release binaries turn it on
# (`.github/workflows/homebrew.yml`); a build from source does not, since it
# needs a C compiler.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
prov-testkit = { workspace = true }

