[package]
name = "prov-history"
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Computes the skiplist that scopes a historica store to a prov workspace's graph"

[dependencies]
prov-graph = { workspace = true, default-features = false }
historica.workspace = true

# Nothing here parses a document — the features exist only because
# `prov-graph` requires at least one metadata-format backend to compile, and a
# workspace that has compiled a format out should not see this crate pull it
# back in.
[features]
default = ["yaml"]
yaml = ["prov-graph/yaml"]
json = ["prov-graph/json"]
toml = ["prov-graph/toml"]
fig-lang = ["prov-graph/fig-lang"]
