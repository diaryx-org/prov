[package]
name = "prov-history"
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "History bounded context for prov workspaces"

[dependencies]
prov-graph = { workspace = true, default-features = false }
prov-store = { workspace = true, default-features = false }
prov-transaction = { workspace = true, default-features = false }
prov-fixity.workspace = true
prov-config = { workspace = true, default-features = false }
fig.workspace = true

[features]
default = ["yaml"]
yaml = [
    "fig/yaml",
    "prov-graph/yaml",
    "prov-store/yaml",
    "prov-config/yaml",
    "prov-transaction/yaml",
]
json = [
    "fig/json",
    "prov-graph/json",
    "prov-store/json",
    "prov-config/json",
    "prov-transaction/json",
]
toml = [
    "fig/toml",
    "prov-graph/toml",
    "prov-store/toml",
    "prov-config/toml",
    "prov-transaction/toml",
]
fig-lang = [
    "fig/fig",
    "prov-graph/fig-lang",
    "prov-store/fig-lang",
    "prov-config/fig-lang",
    "prov-transaction/fig-lang",
]
