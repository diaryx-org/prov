# The `tasks` preset: deferred work kept as documents, with a `status` a tool
# can read. Apply it with `prov presets ./presets/tasks --write` (or `prov init
# --preset ./presets/tasks`), then make the indexes the views hang under —
# `prov new Tasks --in <root>`, `prov new Proposals --in <root>`, at any path,
# since everything here names them by title — and `prov new "<title>" --in
# tasks.md` opens a task as `status: open`, `--in proposals.md` a proposal as
# `status: draft`.
#
# `status` is declared twice, each under its index: a task's terms and a
# proposal's are different closed sets, and a document under neither index has
# no `status` at all — the Tasks index does not open as an open task.
#
# Only the axes the preset declares. The built-in preset supplies `created`
# and `updated`; apply that too if the workspace was not made with it.
fields:
  status:
    - under: '[[Tasks]]'
      values: closed
      vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
      default: open
    - under: '[[Proposals]]'
      values: closed
      vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
      default: draft
  created: { type: datetime }
  updated: { type: datetime }
views:
  open-tasks:
    label: Open tasks
    group: status
    under: '[[Tasks]]'
    where:
      not: { equals: { status: [done, dropped] } }
  proposals:
    label: Proposals
    group: status
    under: '[[Proposals]]'
    where: { has: status }
  work:
    label: All work
    group: status
    where: { has: status }
