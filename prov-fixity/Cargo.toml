[package]
name = "prov-fixity"
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Content fixity digests and coverage policy."
keywords = ["checksum", "sha256", "integrity"]
categories = ["filesystem"]

[dependencies]
prov-graph = { workspace = true, default-features = false }
# The digest itself. See the workspace manifest for why this is not the new
# dependency it looks like.
sha2.workspace = true


[features]
default = ["yaml"]
yaml = ["prov-graph/yaml"]
json = ["prov-graph/json"]
toml = ["prov-graph/toml"]
fig-lang = ["prov-graph/fig-lang"]
