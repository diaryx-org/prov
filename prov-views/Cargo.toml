[package]
name = "prov-views"
description = "Declarative views over a prov workspace: the format, and the traversal that executes it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The read core, and the only dependency. A view selects, groups and orders
# documents that already exist; it has no business creating or editing one, and
# depending on `prov-graph` rather than `prov-store`/`prov` means it *cannot* —
# the same structural guarantee the `prov-store` split bought, for the same
# reason.
prov-graph = { workspace = true, default-features = false }
# The grains a view's `year`/`month`/`day`/`initial` functions cut by, and the
# EDTF reading a calendar grain goes through. Shared with `prov-filing`, which
# nests by the same grains; a view does not depend on filing, nor filing on a
# view. Pure, so the guarantee above holds: nothing here can write.
prov-grain = { workspace = true, default-features = false }
# What a view's `where:` and `key:` are written in — see `src/expr.rs`. An
# interpreter for a language that is not Turing complete and has no side
# effects, so the guarantee above holds: an expression cannot write.
cel.workspace = true
# What `search` folds text through — see `src/search.rs`. Pure and
# dependency-free, so the guarantee above still holds.
unicode-normalization.workspace = true

[dev-dependencies]
prov-testkit = { workspace = true }
# A retired view's `nest:` translates to a filing entry; the tests read it back
# as one. The library writes it as YAML only and never names the type.
prov-filing = { workspace = true }

[features]
default = ["yaml"]
yaml = ["prov-graph/yaml", "prov-grain/yaml"]
json = ["prov-graph/json", "prov-grain/json"]
toml = ["prov-graph/toml", "prov-grain/toml"]
fig-lang = ["prov-graph/fig-lang", "prov-grain/fig-lang"]
