title: prov config
spec: 1
content_format: markdown
id_storage: both
updated: updated
identity: lazy
fixity: on
record_deletions: true
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
created: created
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  created:
    type: datetime
  updated:
    type: datetime
  status:
  - under: '[[Tasks]]'
    values: closed
    vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
    default: open
  - under: '[[Proposals]]'
    values: closed
    vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
    default: draft
views:
  open-tasks:
    label: Open tasks
    # `present(status)` first: an index filed under `Tasks` — the `Closed
    # tasks` shelf a closed task moves to — says no status, and is not an open
    # task.
    where: >-
      doc.ancestors.exists(a, a.title == 'Tasks')
      && present(status) && !(status in ['done', 'dropped'])
    key: status
  proposals:
    label: Proposals
    where: >-
      doc.ancestors.exists(a, a.title == 'Proposals') && present(status)
    key: status
  work:
    label: All work
    where: present(status)
    key: status
workspace_id: prov
root: README.md
exports:
  www:
    label: prov on diaryx.org
    gate:
      field: audience
      value: public
    hold: draft
