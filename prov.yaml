title: prov config
spec: 1
content_format: markdown
id_storage: both
updated: updated
identity: lazy
fixity: on
record_deletions: true
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
created: created
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  created:
    type: datetime
  updated:
    type: datetime
  status:
  - under: '[[Tasks]]'
    values: closed
    vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
    default: open
  - under: '[[Proposals]]'
    values: closed
    vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
    default: draft
views:
  open-tasks:
    label: Open tasks
    group: status
    under: '[[Tasks]]'
    where:
      not:
        equals: { status: [done, dropped] }
  proposals:
    label: Proposals
    group: status
    under: '[[Proposals]]'
    where: { has: status }
  work:
    label: All work
    group: status
    where: { has: status }
workspace_id: prov
root: README.md
exports:
  www:
    label: prov on diaryx.org
    gate:
      field: audience
      value: public
    hold: draft
