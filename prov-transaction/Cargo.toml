[package]
name = "prov-transaction"
description = "Crash-atomic staged filesystem changes and write-ahead recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
prov-graph = { workspace = true, default-features = false }
# The write halves of prov-graph's ports — the `Storage` the journal drives and
# the `Rebase` seam a change set answers through.
prov-store = { workspace = true, default-features = false }

[features]
default = ["yaml"]
yaml = ["prov-graph/yaml", "prov-store/yaml"]
json = ["prov-graph/json", "prov-store/json"]
toml = ["prov-graph/toml", "prov-store/toml"]
fig-lang = ["prov-graph/fig-lang", "prov-store/fig-lang"]
