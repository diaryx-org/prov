# No dependencies, on purpose. This crate is the bottom of prov's stack: the
# filesystem port every other crate is generic over, and the transaction that
# lands a change through it. Nothing here needs to know what a document is, so
# nothing here depends on the crates that do — which is what lets it be lifted
# out as a general-purpose crate (see `docs/`).
