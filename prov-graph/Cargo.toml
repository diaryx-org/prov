[package]
name = "prov-graph"
description = "The read core of a prov workspace: documents, links, and the traversal over them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
# The filesystem port and the transaction that lands a change through it. The
# bottom of the stack: no dependencies of its own, and no knowledge of what a
# document is. `fs` and `exec` here are re-exports of its modules, and its
# `path` helpers are the same ones the write guards clamp against.
fs-transaction = { workspace = true }

# Embedded-metadata backend. See the workspace manifest for why the version
# floor is where it is. Which format backends fig compiles in is governed by
# this crate's features below, which `prov` forwards to.
fig.workspace = true
indexmap.workspace = true
thiserror.workspace = true

# Opaque document-ID verification *and* minting — the alphabet, the
# check-character arithmetic that says whether a string is a well-formed id, and
# the seeded PRNG that rolls one. Minting is not a write: it is a pure function
# of a seed and cannot see a workspace. The retry-on-collision loop that turns a
# mint into a registration *is* a write, and stays in `prov`.
moid.workspace = true

# Body-prose parsing (Djot/Markdown). Zig-backed (its build.rs runs `zig
# build`), so building this crate needs the Zig toolchain. Required, not
# optional: the census scans body `[[wikilinks]]`, and doing that correctly
# means parsing the body well enough to know which spans are code.
twig-doc.workspace = true

[dev-dependencies]
# Property-based testing. The laws this crate carries — `resolve ∘ format = id`,
# the id↔path bijection — are already written down in prose, and an example test
# can only witness one input per law. Dev-only, so it costs a downstream
# consumer nothing.
proptest = "1"

[features]
default = ["yaml"]
yaml = ["fig/yaml"]
json = ["fig/json"]
toml = ["fig/toml"]
fig-lang = ["fig/fig"]
