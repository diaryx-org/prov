[package]
name = "prov"
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "A self-describing plaintext workspace: structure lives in documents' own embedded metadata."
keywords = ["markdown", "frontmatter", "workspace", "knowledge-base"]
categories = ["text-processing", "filesystem"]
publish = true

[dependencies]
# The read core: documents, links, and the traversal over them. `Workspace`
# owns a `prov_graph::Graph` and forwards every read to it, so the two are the
# same traversal rather than a reimplementation that can drift. prov re-exports
# the whole of its public surface, so a consumer that needs both depends only on
# prov.
prov-graph = { path = "../prov-graph", version = "0.4.0", default-features = false }
prov-store = { path = "../prov-store", version = "0.4.0", default-features = false }

# Identity registration policies and opaque ID minting.
prov-identity = { path = "../prov-identity", version = "0.4.0", default-features = false }

# Content fixity policy, digests, and the device-local stat-validated cache.
prov-fixity = { path = "../prov-fixity", version = "0.4.0" }

# Pure workspace policy, codecs, diagnostics, and controlled vocabularies.
prov-config = { path = "../prov-config", version = "0.4.0", default-features = false }

# The declarative view format and its executor. Re-exported at `prov::views`;
# prov itself never executes a view (a view has no invariant to keep).
prov-views = { path = "../prov-views", version = "0.4.0", default-features = false }

# The export format and its planner. Re-exported at `prov::exports`; prov
# itself never *consumes* a plan (publishing, copy-out, and OCFL are
# downstream), but the axis is config and config is read here.
prov-exports = { path = "../prov-exports", version = "0.4.0", default-features = false }

# Crash-atomic staged filesystem changes and write-ahead recovery.
prov-transaction = { path = "../prov-transaction", version = "0.4.0", default-features = false }

# History bounded context. `prov` retains forwarding methods for API
# compatibility; history itself never depends back on this crate.
prov-history = { path = "../prov-history", version = "0.4.0", default-features = false }

# Embedded-metadata backend. fig is a Zig-backed parser/editor (its build.rs
# runs `zig build`). The value tree is prov's common currency. Which format
# backends fig compiles in is governed by prov's features below.
fig.workspace = true
# Field-type vocabulary for `fields.<name>.type` — see `src/config.rs`.
fig-schema.workspace = true
indexmap.workspace = true
thiserror.workspace = true

# Body-prose parsing (Djot/Markdown) — see `src/content.rs`. Zig-backed (its
# build.rs runs `zig build`, same shape as `fig`), so building prov needs
# the Zig toolchain. A required dependency: body rendering and code-aware
# link scanning are always available, not gated behind a feature.
twig-doc.workspace = true

[dev-dependencies]
# Property-based testing. The crate's laws are already written down in prose —
# `resolve ∘ format = id`, the id↔path bijection, "a check-clean workspace stays
# check-clean under any verb" — and an example test can only witness one input
# per law. proptest quantifies over the input space instead, and shrinks a
# failure to the smallest case that still fails, which is the part that makes a
# counterexample readable rather than merely real.
#
# Dev-only on purpose: it is the one place a dependency costs a downstream
# consumer nothing, which is why it does not answer to the same
# hand-roll-it-yourself rule as `fixity`'s SHA-256 or `backup`'s ZIP.
proptest = "1"

[features]
# YAML is the conventional default (`---` frontmatter, `registry.yaml`). Turn it
# off with `default-features = false` and select another format to slim the build.
default = ["yaml"]

# Each feature forwards to the matching `fig` parser/printer backend. With a
# format off, its Zig parser is left out of `libfig.a` *and* prov stops
# recognizing that format (see `whole_file_format`). At least one must be on —
# `lib.rs` enforces this with a `compile_error!`.
yaml = ["fig/yaml", "prov-config/yaml", "prov-graph/yaml",
    "prov-store/yaml", "prov-history/yaml", "prov-identity/yaml", "prov-transaction/yaml", "prov-views/yaml", "prov-exports/yaml"]
json = ["fig/json", "prov-config/json", "prov-graph/json",
    "prov-store/json", "prov-history/json", "prov-identity/json", "prov-transaction/json", "prov-views/json", "prov-exports/json"]
toml = ["fig/toml", "prov-config/toml", "prov-graph/toml",
    "prov-store/toml", "prov-history/toml", "prov-identity/toml", "prov-transaction/toml", "prov-views/toml", "prov-exports/toml"]
# `fig` is the dependency name, so the native-dialect feature is spelled
# `fig-lang` (a feature and a dependency may not share a name unambiguously).
fig-lang = ["fig/fig", "prov-config/fig-lang", "prov-graph/fig-lang",
    "prov-store/fig-lang", "prov-history/fig-lang", "prov-identity/fig-lang", "prov-transaction/fig-lang", "prov-views/fig-lang", "prov-exports/fig-lang"]
