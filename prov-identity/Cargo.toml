[package]
name = "prov-identity"
description = "Identity registration policies and opaque ID minting for prov workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
prov-graph = { workspace = true, default-features = false }
moid.workspace = true

[dev-dependencies]
proptest = "1"

[features]
default = ["yaml"]
yaml = ["prov-graph/yaml"]
json = ["prov-graph/json"]
toml = ["prov-graph/toml"]
fig-lang = ["prov-graph/fig-lang"]
