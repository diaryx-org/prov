name: Release
# The binary half of a release: the `prov` CLI to Homebrew and a WASI build. (Its
# sibling, publish.yml, does the registry half; the notes on the release itself
# are written from the laptop that cut the tag, and are no longer a job here.)
# The build/attach/render/push mechanics are shared with twig,
# fig, and moid and live in diaryx-org/.github; only what makes prov different is
# below.
#
# prov is a Rust workspace: the CLI is the `prov-cli` crate, whose binary is
# named `prov` — hence `cargo-package` and `name` differing. The aarch64-linux
# cross linker the cargo build needs is installed by the shared workflow.
#
# `needs-zig: true` because prov depends on fig-sys/twig-sys, whose build.rs
# builds fig/twig-doc's native library from source (via `zig build`) when no
# prebuilt payload exists for the target — which is the case for wasm32-wasip1,
# and cheap insurance on the native targets.
#
# `wasi: true` attaches a wasm32-wasip1 build to the same Release. It is not part
# of the Homebrew formula (brew doesn't run wasm) — just a portable download for
# any WASI runtime (wasmtime, wasmer, ...).
#
# Nothing here writes the release body. `release <spec> --push` writes it from the
# laptop that cut the tag, out of the section that tag's own tree carries, which
# is why no job here checks out diaryx-org/devtools or installs nu any more. The
# shared workflow creates the release if it gets there first and leaves the body
# alone either way — see the note on its attach step. If a release ever appears
# with binaries and no notes, `release github-release <tag>` is the whole of the
# fix.
#
# Runs on `v*.*.*` tags. Prerequisite before the first tagged release: install
# the diaryx-bot GitHub App on diaryx-org/homebrew-tap (Contents:write) and add
# its App ID + private key as the TAP_APP_ID / TAP_APP_KEY secrets on this repo.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch:
permissions:
  contents: write # caps what the called workflow may request
jobs:
  homebrew:
    uses: diaryx-org/.github/.github/workflows/reusable-homebrew.yml@main
    with:
      name: prov
      desc: "Command-line companion for the prov self-describing workspace library"
      language: rust
      cargo-package: prov-cli
      needs-zig: true
      wasi: true
    secrets:
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
      TAP_APP_KEY: ${{ secrets.TAP_APP_KEY }}
