name: Publish
# Publish the workspace crates to crates.io on a version tag — the registry
# half of a release (its sibling, homebrew.yml, ships the CLI binaries). Both
# fire on the same `v*.*.*` tags, so one `cargo xtask release <spec> --push`
# cuts a complete release.
#
# As in ci.yml, this file holds no knowledge of the workspace: which crates go
# up, in what order, and which are already there is `cargo xtask publish`, which
# derives all three from the manifests. A crate added to the workspace is
# published by the next tag with no edit here.
#
# That command is idempotent by design: before publishing a crate it asks
# crates.io whether that exact version already exists and skips cleanly if so.
# So the workflow is safe to re-run (workflow_dispatch, or a re-pushed tag), and
# a partial release — say `prov` published but `prov-cli` failed — is finished by
# simply running it again: the published crates are skipped, the missing ones go
# up.
#
# Zig, as everywhere in CI: `cargo publish` runs a verification build, and prov's
# `fig`/`twig-doc` dependencies are Zig-backed (their build.rs runs `zig build`),
# so the pinned toolchain must be on PATH. Version mirrors the other workflows.
#
# Auth is the `CARGO_REGISTRY_TOKEN` secret, as in fig, twig, and moid. It was
# Trusted Publishing, which mints a short-lived token per run and needs no stored
# secret — but that token is scoped to the crates this workflow is *registered*
# for, one crate at a time, and every crate in the workspace would need
# registering before its first release through CI. v0.6.0 is what that cost:
# `403 … token is not valid for crate prov-graph`, at the first upload, with ten
# crates behind it — the workspace was eleven crates then, and the count has
# moved twice since, which is the other half of why this is not a per-crate
# scheme.
#
# So: one token, every crate. It must carry `publish-update` for the crates that
# exist and `publish-new` for any crate the workspace has yet to publish, and it
# must not be scoped to a subset of them — a token missing a crate fails the same
# way, at the first upload that needs it. Rotating is a repo-settings edit
# (`gh secret set CARGO_REGISTRY_TOKEN`) and nothing here changes.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: mlugg/setup-zig@v2
      with: { version: "0.16.0" }
    - uses: Swatinem/rust-cache@v2

    # On a tag, the tag must name the version being published — refuse a
    # mismatch rather than publish a surprise. (workflow_dispatch has no tag, so
    # the guard is skipped there.)
    - name: Check the tag against the workspace version
      if: github.ref_type == 'tag'
      run: |
        version=$(cargo run -q -p xtask -- version)
        echo "Workspace version: $version"
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
          exit 1
        fi

    - name: Publish every crate crates.io is missing, in dependency order
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo xtask publish
