name: CI
# Build, lint, and test the prov workspace on every push and pull request.
#
# There is deliberately almost nothing here. Every job is `cargo xtask <id>`, and
# the list of jobs comes from `cargo xtask ci-matrix` rather than from this file,
# so changing CI — adding a job, renaming one, changing what a job runs — is an
# edit to `xtask/src/main.rs` alone. `cargo xtask ci` runs the same jobs locally,
# in the same order.
#
# What the runner still owns is the toolchain, because only it knows how to
# install one: stable Rust, the components a job asks for, and — for jobs that
# compile — the pinned Zig, since prov's `fig` and `twig-doc` dependencies are
# Zig-backed and their build.rs runs `zig build`. The Zig version mirrors
# `.github/workflows/homebrew.yml`.
on:
  push: { branches: [main] }
  pull_request: null
  workflow_dispatch: null

# Cancel superseded runs on the same ref — a new push makes the old one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ask xtask what CI consists of. Needs no Zig and no cache: it builds the
  # dependency-free xtask crate and nothing else.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - id: plan
      run: echo "jobs=$(cargo xtask ci-matrix)" >> "$GITHUB_OUTPUT"

  # One runner per job in that table. `name` is the job's own, so these appear as
  # `CI / Format`, `CI / Clippy`, … — rename a job in xtask and the required
  # status check is renamed with it.
  run:
    name: ${{ matrix.job.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One red job should not hide the state of the others.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with: { components: "${{ matrix.job.components }}" }
    - uses: mlugg/setup-zig@v2
      if: matrix.job.builds
      with: { version: "0.16.0" }
    - uses: Swatinem/rust-cache@v2
      if: matrix.job.builds
    - run: cargo xtask ${{ matrix.job.id }}
